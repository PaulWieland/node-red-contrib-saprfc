<script type="text/x-red" data-help-name="call">
    <p>Make an SAP Remote Function Call (RFC or BAPI).</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">rfc <span class="property-type">string</span></dt>
        <dd>The RFC function or BAPI name to call (e.g. <code>BAPI_USER_CHANGE</code>). Overrides the function configured in the node dialog.</dd>
        <dt class="optional">bapiCommit <span class="property-type">boolean</span></dt>
        <dd>If <code>true</code>, automatically calls <code>BAPI_TRANSACTION_COMMIT</code> before releasing the connection. Overrides the node dialog setting.</dd>
        <dt class="optional">payload <span class="property-type">object</span></dt>
        <dd>The input parameters / import structure to pass to the RFC.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>The data structure returned by the SAP RFC function.</dd>
        <dt class="optional">sapError <span class="property-type">object</span></dt>
        <dd>Contains SAP error information if the call fails.</dd>
    </dl>
    <h3>Details</h3>
    <p>The input <code>msg.payload</code> object will be passed to the RFC. Use a <code>function</code> node or <code>change</code> node to prepare the parameters.</p>
    <p>Use a <code>Catch</code> node to catch and process any errors encountered by the RFC.</p>
</script>

<script type="text/x-red" data-help-name="read table">
    <p>Read data from an SAP Table using <code>RFC_READ_TABLE</code>.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">table <span class="property-type">string</span></dt>
        <dd>The SAP table name to query (e.g. <code>MARA</code>). Overrides the table configured in the node dialog.</dd>
        <dt class="optional">fields <span class="property-type">array | string</span></dt>
        <dd>An array of field names (e.g. <code>["MATNR", "MTART"]</code>) or comma-separated string (e.g. <code>"MATNR, MTART"</code>) to return. Overrides selected fields in the node.</dd>
        <dt class="optional">options <span class="property-type">array | string</span></dt>
        <dd>WHERE conditions for the query as an array of strings or a single string (e.g. <code>["ERSDA >= '20230101'"]</code>).</dd>
        <dt class="optional">rowcount <span class="property-type">number</span></dt>
        <dd>Maximum number of rows to return (default: <code>0</code> for all).</dd>
        <dt class="optional">rowskips <span class="property-type">number</span></dt>
        <dd>Number of rows to skip / offset (default: <code>0</code>).</dd>
        <dt class="optional">payload <span class="property-type">object</span></dt>
        <dd>Alternatively, pass a raw SAP query object containing <code>QUERY_TABLE</code>, <code>FIELDS</code>, <code>OPTIONS</code>, <code>ROWCOUNT</code>, <code>ROWSKIPS</code>.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">array</span></dt>
        <dd>An array of JavaScript objects, where each object represents a table row with property keys matching field names.</dd>
        <dt class="optional">sapError <span class="property-type">object</span></dt>
        <dd>Contains SAP error information if the RFC fails.</dd>
    </dl>
    <h3>Details</h3>
    <p>Converts the raw SAP <code>RFC_READ_TABLE</code> output into clean JavaScript objects.</p>
    <p>Use a <code>Catch</code> node to catch and process any errors encountered by the RFC.</p>
</script>

<script type="text/javascript">
    RED.nodes.registerType('read table',{
        category: 'sapRFC',
        color: '#4091ed',
        defaults: {
            name: {value:"read table"},
			system: {type:"saprfc-config", required: true},
            table: {value:""},
			selectedFields: {value:null}
        },
        inputs:1,
        outputs:1,
		icon: "db.png",
        label: function() {
            return this.name||(this.table ? "read "+this.table : "read table");
        },

        oneditprepare: function() {
            var node = this;
			var nodeId = this.id;
            var fieldListContainer = $("#node-input-status-target-container");
						
            function createFieldList() {
				var selectedFields = node.selectedFields || [];
				
                fieldListContainer.empty();
				$("#node-message").html("");
				
				var data = {
					nodeId: nodeId,
					table: $("#node-input-table").val(),
					systemConfig: $("#node-input-system").val()
				}
				
				if($("#node-input-system").val() === "_ADD_"){
					$("#node-message").html("<span style=\"color: red\">Please select a system</span>");

					return;
				}
			
				// Load the field list for the specified table from the server
				$.ajax({
					method: "post",
					dataType: "json",
					url: 'saprfc_table_fields',
					data: data,
					success: function(data){
						$("#node-input-table").removeClass("input-error");

						if(data.error){
							$("#node-message").html("<span style=\"color: red\">"+data.message+"</span>");
							// This is not conventional, but we need a way to output the sapError object to the debug window in case the RFC fails
							// node.error() is not in context here
							RED.debug.handleDebugMessage({name:"error: read table",msg:data.sapError, level: 20});
							
							// console.log(data.sapError);

							$("#node-input-table").addClass("input-error");
							return;
						}

						
						data.fieldList.forEach((field) => {
							var isChecked = selectedFields.indexOf(field.id) !== -1;
							
							var container = $('<li/>',{class:"node-input-target-field"});
							var row = $('<label/>',{for:"node-input-target-field-"+field.id}).appendTo(container);
		                    $('<input>',{type:"checkbox",class:"node-input-target-field-checkbox",id:"node-input-target-field-"+field.id})
		                        .data('field-id',field.id)
		                        .prop('checked', isChecked)
		                        .appendTo(row);
		                    container.on('mouseover',function(e) {
		                        field.highlighted = true;
		                    });
		                    container.on('mouseout',function(e) {
		                        field.highlighted = false;
		                    });

		                    $('<span>',{class:"node-input-target-field-label",style:"white-space:nowrap"}).text(field.label).appendTo(row);
							$('<span>',{class:"node-input-target-field-id"}).text(field.id).appendTo(row);

		                    container.appendTo(fieldListContainer);
						});
						
		                $(".node-input-target-field-checkbox").change(function() {
		                    if (!this.checked) {
		                        $("#node-input-target-field-checkbox-all").prop('checked',false);
		                    }
		                });
						
						
					},
					error: function(err){
						// This is not conventional, but we need a way to output the sapError object to the debug window in case the ajax call fails
						// node.error() is not in context here
						var errMsg = err;
						if (err && err.readyState !== undefined) {
							// It's a jqXHR object (timeout or network error)
							errMsg = "Error fetching table fields: Network timeout or server unreachable.";
						}
						RED.debug.handleDebugMessage({name:"error: read table",msg:errMsg, level: 20});
						
						// console.log("Error: ",err);
					}
				}); // ajax
			} // createFieldList
			
            function sortfieldListContainer(sortOn) {
                var currentSort = fieldListContainer.data('currentSort');
                var currentSortOrder = fieldListContainer.data('currentSortOrder');

                if (!currentSort) {
                    currentSort = sortOn;
                    currentSortOrder = 'a';
                } else {
                    if (currentSort === sortOn) {
                        currentSortOrder = (currentSortOrder === 'a'?'d':'a');
                    } else {
                        currentSortOrder = 'a';
                    }
                    currentSort = sortOn;
                }
								
                fieldListContainer.data('currentSort',currentSort);
                fieldListContainer.data('currentSortOrder',currentSortOrder);

                $("#node-input-status-target-container-div .fa").hide();
                $(".node-input-status-sort-"+currentSort+"-"+currentSortOrder).show();

                var items = fieldListContainer.find("li").get();
								
                items.sort(function(a,b) {
                    var labelA = $(a).find(".node-input-target-field-"+currentSort).text().toLowerCase();
                    var labelB = $(b).find(".node-input-target-field-"+currentSort).text().toLowerCase();
										
                    if (labelA < labelB) { return currentSortOrder==='a'?-1:1; }
                    if (labelA > labelB) { return currentSortOrder==='a'?1:-1; }
                    return 0;
                });
                $.each(items, function(i, li) {
                    fieldListContainer.append(li);
                });
            }// sortfieldListContainer
			
            $("#node-input-target-sort-id").click(function(e) {
                e.preventDefault();
                sortfieldListContainer('id');
            });

            $("#node-input-target-sort-label").click(function(e) {
                e.preventDefault();
                sortfieldListContainer('label');
            });
			
			// pre populate the field list if the table name already is set
			if($("#node-input-system").val() !== "_ADD_" && node.table){
				createFieldList();
			}

			$('#node-input-table-fetch-fields').click(function(e) {
				createFieldList();
				e.preventDefault();
			});
			
			$('#node-input-table').keypress(function (e) {
			  if (e.which == 13) {
				  createFieldList();

				  return false;
			  }
			});
			
            $("#node-input-target-field-checkbox-all").change(function() {
                $(".node-input-target-field-checkbox").prop('checked',this.checked);
            });
			
		}, // oneditprepare
		
        oneditsave: function() {
            var node = this;
            node.selectedFields = [];
            $(".node-input-target-field-checkbox").each(function(n) {
                if ($(this).prop("checked")) {
                    node.selectedFields.push($(this).data('field-id'));
                }
            });
        }, // oneditsave
		
		
    });
</script>
